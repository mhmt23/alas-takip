<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B2E32">
<title>Alas Takip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alas Takip">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Alas Takip — 338 Ada Kulüp Binası patron panosu.
   Kimlik: Alaş İnşaat grafit grisi + sinyal sarısı. Tek vurgu: "şerit metre" (1 Eki → 1 Ara teslim) üzerinde bugün ve işin gerçek yeri.
   Yerleşim: grafit üst bant (logo + proje), sekmeler (masaüstünde üstte, telefonda altta), içerik 1180 px'e kadar, sola hizalı. */
:root{
  --bg:#ECEDEA; --surface:#FFFFFF; --surface-2:#F5F5F2; --line:#DDDED9; --line-2:#C6C8C2;
  --ink:#24272B; --ink-2:#585858; --ink-3:#878983;
  --graphite:#2B2E32; --graphite-2:#3A3E44; --on-graphite:#F3F4F2; --on-graphite-2:#AEB2B6;
  --yellow:#F0BC00; --yellow-2:#FFDE6B; --yellow-soft:#FFF4CC; --yellow-ink:#6E5400;
  --good:#2C8A55; --good-soft:#E2F1E7; --warn:#C46A00; --warn-soft:#FAE9D2; --crit:#C43A30; --crit-soft:#F7E0DD;
  --plan:#B9BBB5; --plan-soft:#E8E9E5;
  --font:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-cond:"Barlow Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --r-lg:16px; --r:10px; --r-sm:6px;
  --shadow:0 1px 0 rgba(36,39,43,.04),0 6px 18px -10px rgba(36,39,43,.18);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181B; --surface:#202327; --surface-2:#282C31; --line:#33373D; --line-2:#454A51;
  --ink:#EEF0F1; --ink-2:#BABDC1; --ink-3:#868B91;
  --graphite:#0F1113; --graphite-2:#24282D;
  --yellow-soft:#3A3112; --yellow-ink:#F7D458;
  --good:#4CB97F; --good-soft:#1C3326; --warn:#E39A3B; --warn-soft:#3A2A14; --crit:#E86A60; --crit-soft:#3D1F1C;
  --plan:#5D6268; --plan-soft:#2E3237;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181B; --surface:#202327; --surface-2:#282C31; --line:#33373D; --line-2:#454A51;
  --ink:#EEF0F1; --ink-2:#BABDC1; --ink-3:#868B91;
  --graphite:#0F1113; --graphite-2:#24282D;
  --yellow-soft:#3A3112; --yellow-ink:#F7D458;
  --good:#4CB97F; --good-soft:#1C3326; --warn:#E39A3B; --warn-soft:#3A2A14; --crit:#E86A60; --crit-soft:#3D1F1C;
  --plan:#5D6268; --plan-soft:#2E3237;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* ---------- üst bant ---------- */
.top{background:var(--graphite);color:var(--on-graphite);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top .logo{height:38px;width:auto}
.top .sep{width:1px;align-self:stretch;background:var(--graphite-2);margin:4px 0}
.top .proj{display:flex;flex-direction:column;min-width:0}
.top .proj b{font:700 22px/1.05 var(--font-cond);letter-spacing:.01em}
.top .proj span{font-size:13px;color:var(--on-graphite-2)}
.top .hello{margin-left:auto;font-size:14px;color:var(--on-graphite)}
.top .hello + .meta{margin-left:18px}
.top .hello:not([hidden]) + .meta{margin-left:18px}
.top .meta{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--on-graphite-2)}
.top .meta b{color:var(--on-graphite);font-weight:600}
.btn-ghost{border:1px solid var(--graphite-2);background:transparent;color:var(--on-graphite);border-radius:999px;padding:6px 14px;font-size:13px;text-decoration:none;cursor:pointer}
.btn-ghost:hover{border-color:var(--on-graphite-2)}

/* ---------- sekmeler ---------- */
.tabs{max-width:1180px;margin:0 auto;padding:10px 20px 0;display:flex;gap:4px;position:relative}
.tab{appearance:none;border:0;background:transparent;color:var(--on-graphite-2);padding:10px 14px 14px;font:600 15px var(--font);cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0;transition:color .2s var(--ease)}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--on-graphite)}
.tab[aria-selected="true"]{color:var(--on-graphite)}
.tab-ink{position:absolute;bottom:0;height:4px;background:var(--yellow);border-radius:4px 4px 0 0;transition:left .32s var(--ease),width .32s var(--ease)}
.tab .badge{font:600 11px var(--font);background:var(--yellow);color:#2B2E32;border-radius:999px;padding:0 6px;line-height:16px}

/* ---------- içerik ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.panel{display:flex;flex-direction:column;gap:18px}
.panel.giris{animation:giris .28s var(--ease) both}
@keyframes giris{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font:700 26px/1.1 var(--font-cond);margin:0;letter-spacing:.005em}
h3{font:600 17px/1.25 var(--font);margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.sec-h p{margin:0;color:var(--ink-3);font-size:13.5px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--ink-3);text-align:left}
.link-btn{appearance:none;border:0;background:none;color:var(--ink);font:600 14px var(--font);padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font:600 14px var(--font);text-decoration:none;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:#2B2E32}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

/* durum etiketi: renk + simge + metin */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font:600 12.5px var(--font);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.good,.st.done{background:var(--good-soft);color:var(--good)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.crit{background:var(--crit-soft);color:var(--crit)}
.st.plan{background:var(--plan-soft);color:var(--ink-2)}

/* çift çubuk: planlanan (gri) / gerçekleşen (sarı) */
.dual{position:relative;height:10px;border-radius:5px;background:var(--plan-soft);overflow:hidden}
.dual .p{position:absolute;inset:0 auto 0 0;background:var(--plan);border-radius:5px}
.dual .a{position:absolute;left:0;top:2px;bottom:2px;background:var(--yellow);border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.dual-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:5px}
.dual-l b{color:var(--ink);font-weight:600}

/* ---------- özet: hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero-txt{padding:26px 28px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.v-k{margin:0;color:var(--ink-3);font-size:14px}
.v-big{font:700 clamp(46px,7vw,76px)/.92 var(--font-cond);margin:2px 0 0;letter-spacing:-.005em}
.v-big.good{color:var(--good)}.v-big.warn{color:var(--warn)}.v-big.crit{color:var(--crit)}
.v-note{margin:0;color:var(--ink-2);max-width:56ch}
.hero-ph{position:relative;min-height:300px;background:var(--graphite);cursor:zoom-in;border:0;padding:0}
.hero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-ph figcaption{position:absolute;left:14px;bottom:14px;background:rgba(20,22,25,.72);color:#fff;font-size:13px;padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
@media (max-width:900px){.hero-ph{order:-1;min-height:220px;aspect-ratio:16/10}}

/* şerit metre */
.tape-w{display:flex;flex-direction:column;gap:6px}
.tape-marks{position:relative;height:34px}
.mk{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;white-space:nowrap;line-height:1.2}
.mk b{font-weight:600}
.mk::after{content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid currentColor;margin-top:2px}
.mk.today{color:var(--ink)}
.mk.l{transform:translateX(-92%);align-items:flex-end}.mk.l::after{align-self:flex-end;transform:translateX(5px)}
.mk.r{transform:translateX(-8%);align-items:flex-start}.mk.r::after{align-self:flex-start;transform:translateX(-5px)}
.tape-marks.alt{height:36px}.tape-marks.alt .mk{top:0;bottom:auto;flex-direction:column-reverse}
.tape-marks.alt .mk::after{border-top:0;border-bottom:7px solid currentColor;margin:0 0 2px}
.mk.real.crit{color:var(--crit)}.mk.real.warn{color:var(--warn)}.mk.real.good{color:var(--good)}
.tape{position:relative;height:40px;border-radius:7px;background:var(--yellow-soft);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(110,84,0,.18)}
.tape .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--yellow);transition:width 1.1s var(--ease)}
.tape .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(196,58,48,.55) 0 5px,rgba(196,58,48,.15) 5px 10px);opacity:0;transition:opacity .4s .9s}
.tape .gap.on{opacity:1}
.tape .ticks{position:absolute;inset:0}
.tape .ticks i{position:absolute;top:0;width:1px;height:9px;background:rgba(43,46,50,.55)}
.tape .ticks i.w{height:16px;width:1.5px;background:rgba(43,46,50,.85)}
.tape .ticks span{position:absolute;top:17px;transform:translateX(-50%);font:600 11.5px var(--font-cond);color:rgba(43,46,50,.9)}
.tape .now{position:absolute;top:0;bottom:0;width:2px;background:var(--graphite)}
.tape-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);padding-top:14px;margin:0}
@media (max-width:560px){.figs{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}}
.figs div{padding-right:10px}
.figs dt{font-size:12.5px;color:var(--ink-3);order:2}
.figs dd{margin:0;font:700 30px/1 var(--font-cond)}
.figs dd small{font:500 13px var(--font);color:var(--ink-3)}

/* listeler */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-weight:600}
.row .m{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 12px}
.row .full{grid-column:1/-1}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.phase{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.phase .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.phase .t h3{font-size:15px}
.phase .d{font-size:12.5px;color:var(--ink-3)}

/* ---------- günlük rapor ---------- */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;scroll-snap-type:x proximity}
.dchip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;min-width:92px;transition:background .2s,border-color .2s}
.dchip b{display:block;font:700 20px/1 var(--font-cond)}
.dchip span{font-size:12px;color:var(--ink-3)}
.dchip[aria-pressed="true"]{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.dchip[aria-pressed="true"] span{color:var(--on-graphite-2)}
.r-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.r-head h2{font-size:30px}
.r-acts{display:flex;gap:8px;flex-wrap:wrap}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.counter b{display:block;font:700 34px/1 var(--font-cond)}
.counter span{font-size:13px;color:var(--ink-3)}
.counter.y{background:var(--yellow);border-color:var(--yellow);color:#2B2E32}.counter.y span{color:#5a4700}
.trade{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) 64px;gap:6px 12px;align-items:center;font-size:14px;padding:5px 0}
.trade .bar{position:relative;height:16px;border-radius:4px;background:var(--surface-2)}
.trade .bar .p{position:absolute;inset:0 auto 0 0;border:1.5px dashed var(--plan);border-radius:4px}
.trade .bar .a{position:absolute;left:0;top:3px;bottom:3px;background:var(--yellow);border-radius:3px}
.trade .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:16px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;font-size:13.5px;background:var(--surface)}
.chip b{font-weight:600}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.list li{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.list li:first-child{border-top:0}
.list li .x{font-size:12.5px;color:var(--ink-3)}
.why{font:600 12.5px var(--font);color:var(--crit);background:var(--crit-soft);border-radius:999px;padding:1px 9px}
.note{white-space:pre-wrap;color:var(--ink-2);margin:0}

/* medya */
.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.media{grid-template-columns:1fr}}
.tur{display:flex;flex-direction:column;gap:8px}
.tur h3{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.tur h3 span{font-weight:500;color:var(--ink-3);font-size:13px}
.tur .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--graphite);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.ph:hover img{transform:scale(1.03)}
.ph video{width:100%;height:100%;object-fit:cover;background:#000}
.ph.vid{cursor:default}
.ph.vid .cap{top:8px;bottom:auto}
.ph .cap{position:absolute;left:8px;bottom:8px;background:rgba(20,22,25,.72);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;pointer-events:none}

/* karşılaştırma */
.cmp-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cmp-ctl select{font:inherit;padding:7px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink)}
.cmp{position:relative;aspect-ratio:4/3;max-height:72vh;width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--graphite);user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .after{clip-path:inset(0 0 0 var(--x,50%))}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:var(--yellow);transform:translateX(-50%);pointer-events:none}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:38px;height:38px;border-radius:50%;background:var(--yellow);transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.cmp .lab{position:absolute;top:12px;background:rgba(20,22,25,.72);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px}
.cmp .lab.l{left:12px}.cmp .lab.r{right:12px}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.dayblock{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.dayblock + .dayblock{border-top:1px solid var(--line);padding-top:18px}
.dayblock h3{font:700 22px/1.1 var(--font-cond)}

/* ekip grafiği */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink-3);font:12px var(--font)}
.chart .vl{fill:var(--ink-2);font:600 12px var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .pl{fill:none;stroke:var(--plan);stroke-width:1.5;stroke-dasharray:4 3}
.chart .ac{fill:var(--yellow)}

/* gantt */
.gtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font:600 13.5px var(--font);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--graphite);color:var(--on-graphite)}
.gantt{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.g{display:grid;grid-template-columns:240px max-content;min-width:max-content}
.g .nm{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line-2);padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:28px;line-height:28px}
.g .nm.s{font:700 14px/28px var(--font-cond);background:var(--surface-2)}
.g .nm.l2{padding-left:20px}
.g .rw{position:relative;height:28px;border-bottom:1px solid var(--line)}
.g .rw.s{background:var(--surface-2)}
.g .hd{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line-2)}
.g .hd.nm{z-index:4;height:44px;line-height:44px;font-weight:600}
.months{display:flex;height:22px;font:700 12.5px/22px var(--font-cond)}
.months div{border-left:1px solid var(--line-2);padding-left:6px;overflow:hidden;white-space:nowrap}
.dn{display:flex;height:22px;font-size:10.5px;color:var(--ink-3)}
.dn div{text-align:center;line-height:22px;border-left:1px solid var(--line)}
.dn div.we{background:var(--surface-2)}
.gb{position:absolute;top:8px;height:12px;border-radius:4px;background:var(--plan);overflow:hidden}
.gb .f{position:absolute;inset:0 auto 0 0;background:var(--yellow)}
.gb.crit{box-shadow:0 0 0 1.5px var(--crit)}.gb.warn{box-shadow:0 0 0 1.5px var(--warn)}.gb.done{background:var(--good)}
.gb.s{top:10px;height:8px;background:var(--ink-3)}.gb.s .f{background:var(--ink)}
.gbl{position:absolute;top:22px;height:3px;background:var(--plan);border-radius:2px;opacity:.9}
.gms{position:absolute;top:9px;width:10px;height:10px;transform:rotate(45deg);background:var(--ink);border-radius:1px}
.gms.done{background:var(--good)}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:1;pointer-events:none}
.gpct{position:absolute;right:6px;top:0;line-height:28px;font-size:11px;color:var(--ink-3)}
.slip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:11px 0;border-top:1px solid var(--line)}
.slip:first-child{border-top:0}
.slip .d{font:700 26px/1 var(--font-cond);color:var(--crit);white-space:nowrap;align-self:center}
.slip .d small{font:500 12px var(--font);color:var(--ink-3)}
.hbar{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr) 44px;gap:6px 12px;align-items:center;font-size:14px;padding:4px 0}
.hbar .b{height:12px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.hbar .b i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.hbar .v{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ışık kutusu */
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,11,13,.94);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;color:#fff;font-size:14px}
.lb .bar button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.lb .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 8px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.98);transition:transform .25s var(--ease)}
.lb.open img{transform:none}

footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:4px}
footer img{height:22px;width:auto;opacity:.8;margin-bottom:6px}

/* ---------- telefon: alt sekme çubuğu ---------- */
@media (max-width:720px){
  .top-in{padding:12px 16px 12px;gap:12px}
  .top .logo{height:30px}
  .top .proj b{font-size:19px}
  .top .meta{display:none}
  .top .hello{flex-basis:100%;margin:2px 0 0;font-size:13px;color:var(--on-graphite-2)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:none;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--graphite);gap:0;justify-content:space-around;box-shadow:0 -6px 18px -8px rgba(0,0,0,.4)}
  .tab{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:11.5px;border-radius:10px}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{color:var(--yellow)}
  .tab .badge{position:absolute;margin:-4px 0 0 22px}
  .tab-ink{display:none}
  main{padding:16px 16px 110px}
  footer{padding-bottom:110px}
  .hero-txt{padding:20px 18px}
  .card{padding:16px}
  .trade,.hbar{grid-template-columns:minmax(90px,130px) minmax(0,1fr) 48px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.tabs,.top .meta,.lb{display:none!important}main{padding:0}.panel[hidden]{display:flex!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <img class="logo" src="brand/alas-logo-beyaz.png" alt="Alaş İnşaat" width="94" height="38">
    <span class="sep" aria-hidden="true"></span>
    <div class="proj"><b id="pTitle">338 Ada Kulüp Binası</b><span id="pPlace">Kuşçular, Urla / İzmir</span></div>
    <span class="hello" id="hello" hidden></span>
    <div class="meta"><span id="pUpd"></span><a id="cikis" class="btn-ghost" href="/cikis" hidden>Çıkış</a></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button class="tab" role="tab" id="tab-ozet" aria-controls="ozet" data-t="ozet"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1.4"/></svg><span>Özet</span></button>
    <button class="tab" role="tab" id="tab-rapor" aria-controls="rapor" data-t="rapor"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12h7M8.5 16h5"/></svg><span>Günlük rapor</span></button>
    <button class="tab" role="tab" id="tab-program" aria-controls="program" data-t="program"><svg viewBox="0 0 24 24"><path d="M4 6h9M7 11h10M10 16h10M4 21h16"/></svg><span>Program</span></button>
    <button class="tab" role="tab" id="tab-ekip" aria-controls="ekip" data-t="ekip"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A4.5 4.5 0 0 1 21 18.5"/></svg><span>Ekip</span></button>
    <button class="tab" role="tab" id="tab-cekim" aria-controls="cekim" data-t="cekim"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg><span>Çekimler</span></button>
    <span class="tab-ink" aria-hidden="true"></span>
  </nav>
</header>

<main>
  <section class="panel" id="ozet" role="tabpanel" aria-labelledby="tab-ozet"></section>
  <section class="panel" id="rapor" role="tabpanel" aria-labelledby="tab-rapor" hidden></section>
  <section class="panel" id="program" role="tabpanel" aria-labelledby="tab-program" hidden></section>
  <section class="panel" id="ekip" role="tabpanel" aria-labelledby="tab-ekip" hidden></section>
  <section class="panel" id="cekim" role="tabpanel" aria-labelledby="tab-cekim" hidden></section>
</main>
<footer id="foot"></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Fotoğraf" aria-hidden="true">
  <div class="bar"><span id="lbCap"></span><span style="display:flex;gap:8px"><button type="button" id="lbPrev" aria-label="Önceki">‹</button><button type="button" id="lbNext" aria-label="Sonraki">›</button><button type="button" id="lbClose">Kapat</button></span></div>
  <div class="img"><img id="lbImg" alt=""></div>
</div>

<script>
(async function () {
  // ---------------- veri ----------------
  let D = window.PANO_DATA, SERVER = false;
  if (!D) {
    SERVER = true;
    const q = new URLSearchParams(location.search);
    const r = await fetch("/api/pano.json" + (q.get("dataset") ? "?dataset=" + encodeURIComponent(q.get("dataset")) : ""), { credentials: "same-origin", cache: "no-store" });
    if (r.status === 401) { location.replace("/?next=" + encodeURIComponent(location.pathname + location.search)); return; }
    if (!r.ok) { document.querySelector("main").innerHTML = '<div class="empty">Pano verisi alınamadı (' + r.status + '). Sayfayı yenileyin.</div>'; return; }
    D = await r.json();
  }
  D.tasks = D.tasks || []; D.days = D.days || []; D.logs = D.logs || []; D.reports = D.reports || []; D.project = D.project || {};

  // ---------------- yardımcılar ----------------
  const MS = 864e5;
  const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const AYK = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  const GUNK = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
  const pd = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = d => `${d.getDate()} ${AY[d.getMonth()]}`;
  const fmtK = d => `${d.getDate()} ${AYK[d.getMonth()]}`;
  const fmtY = d => `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}`;
  const dd = (a, b) => Math.round((a - b) / MS);
  const add = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = s => document.querySelector(s);
  const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
  const pct = x => Math.round(x * 100);

  const gen = String(D.generated || "");
  const today = gen ? pd(gen) : (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  const pStart = pd(D.project.projectStart || "2026-10-01");
  const pFinish = pd(D.project.projectFinish || "2027-01-03");
  const handover = pd(D.project.handover || "2026-12-01");

  // ---------------- program hesapları ----------------
  const tasks = D.tasks.map(t => ({ ...t, name: String(t.name || "").trim(), s: pd(t.start), f: pd(t.finish), bs: t.bStart ? pd(t.bStart) : null, bf: t.bFinish ? pd(t.bFinish) : null }));
  const leaves = tasks.filter(t => !t.summary);
  const plannedAt = (t, d) => { const s = t.bs || t.s, f = t.bf || t.f; if (d < s) return 0; if (d >= f) return 1; return clamp((dd(d, s) + 1) / (dd(f, s) + 1), 0, 1); };
  const agg = (list, d) => { let w = 0, p = 0, a = 0; for (const t of list) { const x = t.dur > 0 ? t.dur : 0; if (!x) continue; w += x; p += x * plannedAt(t, d); a += x * (t.pct || 0) / 100; } return w ? { p: p / w, a: a / w, w } : { p: 0, a: 0, w: 0 }; };
  const statusOf = (t, d) => {
    if (t.pct >= 100) return { k: "done", l: "Tamamlandı" };
    const p = plannedAt(t, d);
    if (p === 0) return { k: "plan", l: dd(t.s, d) <= 7 ? "Başlayacak" : "Planlandı" };
    if ((t.pct || 0) / 100 >= p - 1e-9) return { k: "good", l: "Programda" };
    if (d > (t.bf || t.f) || p - (t.pct || 0) / 100 > .5) return { k: "crit", l: "Gecikmiş" };
    return { k: "warn", l: "Geride" };
  };
  const childrenOf = sm => { const i = tasks.indexOf(sm), out = []; for (let j = i + 1; j < tasks.length; j++) { if (tasks[j].level <= sm.level) break; if (!tasks[j].summary) out.push(tasks[j]); } return out; };
  const scope = leaves.filter(t => t.f <= handover);
  const tot = agg(scope, today);
  let realDate = pStart;
  for (let d = pStart; d <= pFinish; d = add(d, 1)) { if (agg(scope, d).p >= tot.a - 1e-9) { realDate = d; break; } }
  const varDays = tot.w ? dd(realDate, today) : 0;
  const vK = !tot.w ? "plan" : varDays >= -1 ? "good" : varDays >= -5 ? "warn" : "crit";
  const vT = !tot.w ? "Veri bekleniyor" : varDays >= -1 ? (varDays > 1 ? `${varDays} gün önde` : "Programa uygun") : `${-varDays} gün geride`;
  const fc = D.project.forecastHandover ? pd(D.project.forecastHandover) : null;
  const fcSlip = fc ? dd(fc, handover) : 0;

  const logs = D.logs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const reports = new Map(D.reports.map(r => [r.date, r]));
  const crewPlan = D.crewPlan || {};
  const days = D.days.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const photos = []; days.forEach(d => d.sessions.forEach(s => (s.photos || []).forEach(p => photos.push({ ...p, date: d.date, label: s.label || s.id }))));
  const lastPhoto = photos[photos.length - 1];
  const people = L => sum(Object.values(L.crews || {}));
  const planned = L => sum(Object.values(crewPlan[L.date] || {}));

  // ---------------- üst bant ----------------
  if (D.project.title) $("#pTitle").textContent = D.project.title.toLocaleLowerCase("tr").replace(/(^|\s)\S/g, m => m.toLocaleUpperCase("tr"));
  if (D.project.place) $("#pPlace").textContent = D.project.place;
  $("#pUpd").innerHTML = gen ? `Güncelleme <b>${fmtK(today)} ${esc(gen.slice(11, 16))}</b>` : "";
  if (SERVER) {
    $("#cikis").hidden = false;
    // Hesaba özel karşılama (kullanıcı adı → hitap). Sadece tanımlı hesaplarda görünür.
    const HITAP = { patron: "Engin Bey" };
    fetch("/api/me", { credentials: "same-origin", cache: "no-store" }).then(r => r.ok ? r.json() : null).then(me => {
      const ad = me && HITAP[me.username];
      if (ad) { const h = $("#hello"); h.textContent = `Hoş geldiniz, ${ad}`; h.hidden = false; }
    }).catch(() => {});
  }

  // ---------------- ortak parçalar ----------------
  const dual = (p, a) => `<div class="dual" role="img" aria-label="Planlanan yüzde ${pct(p)}, gerçekleşen yüzde ${pct(a)}"><div class="p" style="width:${(p * 100).toFixed(1)}%"></div><div class="a" style="width:${(a * 100).toFixed(1)}%"></div></div><div class="dual-l"><span>Gerçekleşen <b>%${pct(a)}</b></span><span>Planlanan <b>%${pct(p)}</b></span></div>`;
  const photoBtn = (p, cap) => `<button type="button" class="ph" data-ph="${esc(p.f)}"><img src="${esc(p.src)}" alt="Drone görüntüsü ${esc(cap)}" loading="lazy"><span class="cap">${esc(cap)}</span></button>`;
  const videoBox = (src, cap) => `<div class="ph vid"><video controls preload="metadata" playsinline muted src="${esc(src)}#t=0.1"></video><span class="cap">${esc(cap)}</span></div>`;
  const turHTML = (d, s) => {
    const p = (s.photos || [])[0];
    return `<div class="tur"><h3>${esc(s.label || s.id)} turu <span>${esc(s.start)}${s.end && s.end !== s.start ? "–" + esc(s.end) : ""}</span></h3><div class="pair">${p ? photoBtn(p, "Fotoğraf " + p.t) : ""}${s.video ? videoBox(s.video, "Video " + (s.videoTime || "")) : ""}</div></div>`;
  };

  // ================= ÖZET =================
  function renderOzet() {
    const span = Math.max(1, dd(handover, pStart));
    const x = d => clamp(dd(d, pStart) / span * 100, 0, 100);
    let ticks = "", lastLab = -9;
    for (let i = 0; i <= span; i++) {
      const d = add(pStart, i), w = d.getDay() === 1 || d.getDate() === 1;
      ticks += `<i class="${w ? "w" : ""}" style="left:${(i / span * 100).toFixed(2)}%"></i>`;
      if (w && i > 1 && i < span - 2 && i - lastLab >= 4) { ticks += `<span style="left:${(i / span * 100).toFixed(2)}%">${d.getDate() === 1 ? AYK[d.getMonth()] : d.getDate()}</span>`; lastLab = i; }
    }
    const xt = x(today), xr = x(realDate);
    const edge = v => v < 8 ? "r" : v > 92 ? "l" : "";   // kenara yakın etiket taşmasın
    const gapL = Math.min(xt, xr), gapW = Math.abs(xt - xr);
    const kalan = dd(handover, today);
    const activeN = scope.filter(t => t.pct < 100 && t.s <= today && t.f >= today).length;
    const lateN = scope.filter(t => ["warn", "crit"].includes(statusOf(t, today).k)).length;
    const note = !tot.w ? "Program verisi geldiğinde burada ilerleme görünecek."
      : varDays < -1 && fc && fcSlip <= 0 ? `İşler bugün ${fmt(realDate)} tarihinin planlanan seviyesinde. Geride kalan işlerin bolluğu olduğu için MS Project teslim tarihini henüz kaydırmıyor.`
      : fcSlip > 0 ? `Kritik yoldaki gecikme tahmini teslimi ${fcSlip} gün ileri itti.`
      : "Gerçekleşen iş, bugün itibarıyla planlanan seviyede.";
    const L = logs[logs.length - 1];
    const week = leaves.filter(t => t.pct < 100 && t.f >= add(today, -2) && t.s <= add(today, 7)).sort((a, b) => a.s - b.s);
    const phases = tasks.filter(t => t.summary && t.level === 1);

    $("#ozet").innerHTML = `
      <div class="hero">
        <div class="hero-txt">
          <div>
            <p class="v-k">1 Aralık ileri kaba teslimine göre</p>
            <h1 class="v-big ${vK}">${esc(vT)}</h1>
          </div>
          <p class="v-note">${esc(note)}</p>
          <div class="tape-w" aria-label="Zaman şeridi: başlangıç 1 Ekim, teslim 1 Aralık">
            <div class="tape-marks">
              <div class="mk today ${edge(xt)}" style="left:${xt}%"><b>Bugün</b>${fmtK(today)}</div>
            </div>
            <div class="tape"><div class="fill" data-w="${xr.toFixed(2)}"></div><div class="gap" style="left:${gapL}%;width:${gapW}%"></div><div class="ticks">${ticks}</div><div class="now" style="left:${xt}%"></div></div>
            ${tot.w && Math.abs(xt - xr) > 1 ? `<div class="tape-marks alt"><div class="mk real ${vK} ${edge(xr)}" style="left:${xr}%"><b>İş burada</b>${fmtK(realDate)}</div></div>` : ""}
            <div class="tape-l"><span>Başlangıç ${fmtK(pStart)}</span><span>Teslim ${fmtK(handover)}</span></div>
          </div>
          <dl class="figs">
            <div><dd class="num">${kalan}</dd><dt>gün kaldı</dt></div>
            <div><dd class="num" style="color:${fcSlip > 0 ? "var(--crit)" : "inherit"}">${fc ? fmtK(fc) : "—"}</dd><dt>tahmini teslim</dt></div>
            <div><dd class="num">%${pct(tot.a)} <small>/ %${pct(tot.p)}</small></dd><dt>gerçekleşen / plan</dt></div>
            <div><dd class="num" style="color:${lateN ? "var(--crit)" : "inherit"}">${lateN}</dd><dt>iş geride (${activeN} iş sürüyor)</dt></div>
          </dl>
        </div>
        ${lastPhoto ? `<button type="button" class="hero-ph" data-ph="${esc(lastPhoto.f)}"><img src="${esc(lastPhoto.src)}" alt="Şantiyenin son drone görüntüsü"><figcaption>Son çekim · ${fmt(pd(lastPhoto.date))} ${esc(lastPhoto.t)}</figcaption></button>` : `<div class="hero-ph" style="cursor:default"></div>`}
      </div>

      <div class="grid2">
        <article class="card">
          <div class="sec-h" style="margin-bottom:10px"><h2>Son günlük rapor</h2>${L ? `<button type="button" class="link-btn" data-go="rapor">Raporu aç</button>` : ""}</div>
          ${L ? (() => {
            const e = L.entries || [], ok = e.filter(x => x.status !== "notdone"), no = e.filter(x => x.status === "notdone");
            return `<p class="muted small" style="margin:0 0 12px">${fmtY(pd(L.date))}, ${GUN[pd(L.date).getDay()]}${L.weather ? " · " + esc(L.weather) : ""}</p>
              <div class="counters" style="grid-template-columns:repeat(3,minmax(0,1fr))">
                <div class="counter y"><b class="num">${people(L)}</b><span>kişi çalıştı</span></div>
                <div class="counter"><b class="num">${ok.length}</b><span>iş yapıldı</span></div>
                <div class="counter"><b class="num" style="color:${no.length ? "var(--crit)" : "inherit"}">${no.length}</b><span>iş yapılamadı</span></div>
              </div>
              ${no.length ? `<ul class="list" style="margin-top:10px">${no.slice(0, 3).map(x => `<li><span>${esc(x.name)}</span>${x.reason ? `<span class="why">${esc(x.reason)}</span>` : ""}</li>`).join("")}${no.length > 3 ? `<li class="x">ve ${no.length - 3} iş daha</li>` : ""}</ul>` : ""}`;
          })() : `<div class="empty">Henüz günlük rapor girilmedi. Şantiye şefi akşam raporu girdiğinde burada görünür.</div>`}
        </article>
        <article class="card">
          <div class="sec-h" style="margin-bottom:6px"><h2>Bu hafta sahada</h2><button type="button" class="link-btn" data-go="program">Tüm program</button></div>
          <div class="rows">${week.slice(0, 7).map(t => { const st = statusOf(t, today); return `<div class="row"><div><div class="n">${esc(t.name)}</div><div class="m"><span>${fmtK(t.s)}${t.dur > 0 ? "–" + fmtK(t.f) : ""}</span>${t.crew ? `<span>${esc(t.crew)}</span>` : ""}</div></div><span class="st ${st.k}">${st.l}</span></div>`; }).join("") || `<div class="empty">Bu hafta planlanmış açık iş yok.</div>`}
          ${week.length > 7 ? `<div class="row"><span class="muted small">ve ${week.length - 7} iş daha</span></div>` : ""}</div>
        </article>
      </div>

      <section class="card">
        <div class="sec-h" style="margin-bottom:12px"><h2>Aşamalar</h2><p>Gri: bugüne kadar planlanan. Sarı: gerçekleşen.</p></div>
        <div class="phase-grid">${phases.map(ph => {
          const a = agg(childrenOf(ph), today); let k = "plan", l = "Başlamadı";
          if (a.a >= .999) { k = "done"; l = "Tamamlandı"; } else if (a.p > 0) { const g = a.p - a.a; k = g <= .02 ? "good" : g > .25 ? "crit" : "warn"; l = k === "good" ? "Programda" : k === "crit" ? "Gecikmiş" : "Geride"; }
          return `<div class="phase"><div class="t"><h3>${esc(ph.name.replace(/^\d+\.\s*/, ""))}</h3><span class="st ${k}">${l}</span></div><div class="d">${fmtK(ph.s)} – ${fmtK(ph.f)}</div>${dual(a.p, a.a)}</div>`;
        }).join("")}</div>
      </section>`;
    // tek açılış hareketi: şerit dolar, gecikme taraması belirir

  function renderGantt() {
    const W = 15;
    let rows;
    if (gMode === "all") rows = tasks;
    else {
      const lo = add(today, -7), hi = add(today, 21), keep = new Set();
      tasks.forEach(t => { if (!t.summary && t.f >= lo && t.s <= hi) keep.add(t.id); });
      tasks.forEach(t => { if (t.summary && childrenOf(t).some(c => keep.has(c.id))) keep.add(t.id); });
      rows = tasks.filter(t => keep.has(t.id));
    }
    const gs = gMode === "all" ? pStart : add(today, -10), ge = gMode === "all" ? pFinish : add(today, 24);
    const n = dd(ge, gs) + 1, x = d => dd(d, gs) * W, tx = x(today) + W / 2, showNow = today >= gs && today <= ge;
    let months = "", dn = "";
    for (let i = 0; i < n; i++) {
      const d = add(gs, i);
      if (i === 0 || d.getDate() === 1) { let sp = 0; for (let j = i; j < n; j++) { if (j > i && add(gs, j).getDate() === 1) break; sp++; } months += `<div style="width:${sp * W}px">${sp * W < 70 ? (sp * W < 30 ? "" : AYK[d.getMonth()]) : AYK[d.getMonth()] + " " + d.getFullYear()}</div>`; }
      dn += `<div class="${d.getDay() === 0 || d.getDay() === 6 ? "we" : ""}" style="width:${W}px">${d.getDate()}</div>`;
    }
    let h = `<div class="g"><div class="nm hd">İş kalemi</div><div class="hd" style="width:${n * W}px;position:sticky"><div class="months">${months}</div><div class="dn">${dn}</div></div>`;
    rows.forEach(t => {
      const st = statusOf(t, today); let bar = "";
      if (!(t.s > ge || t.f < gs)) {
        if (t.milestone || t.dur === 0) bar = `<div class="gms ${t.pct >= 100 ? "done" : ""}" style="left:${x(t.s) + 2}px" title="${esc(t.name)} · ${fmtK(t.s)}"></div>`;
        else {
          const fill = t.summary ? agg(childrenOf(t), today).a * 100 : (t.pct || 0);
          const s0 = t.s < gs ? gs : t.s, f0 = t.f > ge ? ge : t.f;
          bar = `<div class="gb ${t.summary ? "s" : st.k}" style="left:${x(s0)}px;width:${(dd(f0, s0) + 1) * W - 2}px" title="${esc(t.name)} · ${fmtK(t.s)}–${fmtK(t.f)} · %${Math.round(fill)}"><div class="f" style="width:${fill}%"></div></div>`;
          if (!t.summary && t.bs && t.bf && (+t.bs !== +t.s || +t.bf !== +t.f) && t.bf >= gs && t.bs <= ge) { const b0 = t.bs < gs ? gs : t.bs, b1 = t.bf > ge ? ge : t.bf; bar += `<div class="gbl" style="left:${x(b0)}px;width:${(dd(b1, b0) + 1) * W - 2}px" title="Temel plan ${fmtK(t.bs)}–${fmtK(t.bf)}"></div>`; }
        }
      }
      h += `<div class="nm ${t.summary ? "s" : "l2"}" title="${esc(t.name)}">${esc(t.name)}</div><div class="rw ${t.summary ? "s" : ""}" style="width:${n * W}px">${showNow ? `<div class="gnow" style="left:${tx}px"></div>` : ""}${bar}${!t.summary && t.dur > 0 ? `<span class="gpct">%${t.pct || 0}</span>` : ""}</div>`;
    });

    g.scrollLeft = Math.max(0, tx - 300);
  }

  // ================= EKİP =================

    const mx = Math.max(1, ...hist.map(h => Math.max(h.g, h.p)));

    const bars = hist.map((h, i) => { const cx = pl + cw * i + cw / 2; return `<g><title>${fmtY(h.d)}: ${h.g} kişi geldi${h.p ? `, ${h.p} planlandı` : ""}</title>${h.p ? `<rect class="pl" x="${cx - bw / 2 - 3}" y="${y(h.p)}" width="${bw + 6}" height="${y(0) - y(h.p)}" rx="3"/>` : ""}<rect class="ac" x="${cx - bw / 2}" y="${y(h.g)}" width="${bw}" height="${Math.max(0, y(0) - y(h.g))}" rx="3"/><text class="vl" x="${cx}" y="${y(Math.max(h.g, h.p)) - 5}" text-anchor="middle">${h.g}</text><text class="ax" x="${cx}" y="${VH - 10}" text-anchor="middle">${h.d.getDate()} ${AYK[h.d.getMonth()]}</text></g>`; }).join("");
    const by = new Map(); logs.forEach(L => Object.entries(L.crews || {}).forEach(([k, v]) => by.set(k, (by.get(k) || 0) + (+v || 0))));
    const bt = [...by].filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]); const bmx = bt.length ? bt[0][1] : 1;
    const mm = new Map(); logs.forEach(L => Object.entries(L.machines || {}).forEach(([k, v]) => mm.set(k, (mm.get(k) || 0) + (+v || 0))));
    const mt = [...mm].filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]); const mmx = mt.length ? mt[0][1] : 1;
    const totG = sum(hist.map(h => h.g)), totP = sum(hist.map(h => h.p));
    el.innerHTML = `
      <section class="card chart">
        <div class="sec-h" style="margin-bottom:8px"><h2>Sahadaki kişi sayısı</h2><div class="legend"><span><i style="background:var(--yellow)"></i>gelen</span><span><i style="border:1.5px dashed var(--plan)"></i>planlanan</span></div></div>
        <p class="muted small" style="margin:0 0 6px">Son ${hist.length} rapor: toplam ${totG} adam-gün${totP ? `, planlanan ${totP}` : ""}.</p>
        <svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Günlük kişi sayısı grafiği">${grid}${bars}</svg>
      </section>
      <div class="grid2">
        <section class="card"><div class="sec-h" style="margin-bottom:8px"><h3>Meslek dağılımı</h3><p>adam-gün, tüm raporlar</p></div>${bt.map(([k, v]) => `<div class="hbar"><span>${esc(k)}</span><div class="b"><i style="width:${v / bmx * 100}%;background:var(--yellow)"></i></div><span class="v">${v}</span></div>`).join("") || `<div class="empty">Kayıt yok</div>`}</section>

      </div>`;
  }

  const ink = $(".tab-ink");

  function go(t, first) {
